[package]
name = "f1-fp-mul-asmref"
version = "0.1.0"
edition = "2021"
publish = false
description = "Stage F1 reference ceiling: pasta_curves 0.6.1 with the `asm` backend (MULX + ADCX/ADOX). NOT a production path -- only answers 'how fast can this primitive get'."

[dependencies]
# 0.6.1 is the first release with the hand-written assembly backend
# (transcribed from Supranational Semolina). The `asm` feature is NOT enabled by
# any Orchard dependency, so this is a reference ceiling, not the baseline.
pasta_curves = { version = "=0.6.1", features = ["glv", "asm"] }
ff = "0.14"
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[profile.release]
debug = false
