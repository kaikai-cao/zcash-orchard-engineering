[package]
name = "orchard-e2e"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end Orchard bundle build/prove/sign/verify measurement harness (external to the upstream repo)"

# The upstream checkout is kept pristine; we consume it as a path dependency.
# Path is relative to this crate: harness -> transaction_e2e -> experiments -> repo -> D:\Research
[features]
# Stage F3 · LC probe. Off by default so the harness keeps compiling against the
# FROZEN vendor: `halo2_proofs::f3lc` only exists after
# `vendor/halo2_proofs-0.4.0-f3-lc-probe.patch` is applied, and that patch is
# deliberately not part of the frozen tree. With the feature off, no LC code is
# compiled at all, so the baseline binary stays byte-identical.
f3lc = []

# Stage F3 / H7 probe. Off by default: `halo2_proofs::f3h7` only exists after
# `vendor/halo2_proofs-0.4.0-h7-borrowed.patch` is applied, and the baseline side
# of the A/B must keep compiling against H6 alone.
f3h7 = []

# Stage F4 constraint-system census. Off by default: `halo2_proofs::f4` only
# exists after `vendor/halo2_proofs-0.4.0-f4-recon.patch` is applied. The census
# is read-only, but it still lives in the vendored crate, so it is a patch.
f4 = []

[dependencies]
orchard = { path = "../../../../orchard-upstream", features = ["circuit", "multicore"] }
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
incrementalmerkletree = "0.9"
pasta_curves = "0.6"
# Stage E3 in-process CPU sampler (gated behind ORCHARD_E3_SAMPLE; types-only,
# no runtime cost on the proving path). Used to walk stacks via DbgHelp because
# the non-admin session cannot start an ETW kernel logger.
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Kernel",
] }
# Same feature set orchard itself enables, so adding this direct dependency does
# not perturb the dependency graph the perf numbers were taken on.
halo2_proofs = { version = "0.4", default-features = false, features = [
    "batch",
    "floor-planner-v1-legacy-pdqsort",
    "multicore",
] }

[profile.release]
debug = false

# Stage E3 CPU-sampling build: SAME release optimizations (opt-level 3, LTO off
# as in release) but with PDB debug info so ETW/WPA can resolve Rust symbols.
# Output lands in target/sampling/, so it never overwrites the frozen
# target/release/ baseline binary used by E1/E2.
[profile.sampling]
inherits = "release"
debug = true

# Stage H1c: the release profile with exactly one setting changed -- `lto`.
# Single-factor by construction: opt-level (3), debug (false), codegen-units
# (16), panic (unwind) and the (absent) target-cpu flag all inherit from
# release, so anything measured here is attributable to LTO alone.
# Output lands in target/lto/, never overwriting target/release/.
[profile.lto]
inherits = "release"
lto = "fat"

# Same LTO, but with PDB debug info, so the E3 sampler can resolve symbols and
# so the disassembly check has a symbolised counterpart on both sides
# (target/sampling/ vs target/lto-sampling/).
[profile.lto-sampling]
inherits = "lto"
debug = true

# Stage E2 source-level timing: point halo2_proofs at the local, instrumented
# vendored copy. The patch is a no-op for correctness — same version (0.4.0),
# same sources except the optional ORCHARD_E2_TIMING phase timers. Disabled by
# default (timers early-return unless the env var is set), so baseline numbers
# are unaffected.
[patch.crates-io]
halo2_proofs = { path = "../vendor/halo2_proofs-0.4.0" }
